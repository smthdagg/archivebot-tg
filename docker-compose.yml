# 日志轮转：json-file 单文件最大 20M，保留 3 份，避免长期无上限增长
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - redis-data:/data

  bot:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/archivebot.db
      STORAGE_DIR: /storage
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.bot.main"]
    volumes:
      - ./app:/app/app
      - ./vendor/ArchiveBOT:/app/vendor/ArchiveBOT
      - ./vendor/wechat_to_md:/app/vendor/wechat_to_md
      - ./data:/app/data
      - ./storage:/storage
    depends_on:
      - redis

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/archivebot.db
      STORAGE_DIR: /storage
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.main"]
    ports:
      - "${WEB_ADMIN_PORT:-8080}:8080"
    volumes:
      - ./app:/app/app
      - ./vendor/ArchiveBOT:/app/vendor/ArchiveBOT
      - ./vendor/wechat_to_md:/app/vendor/wechat_to_md
      - ./data:/app/data
      - ./storage:/storage
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/archivebot.db
      STORAGE_DIR: /storage
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.tasks.worker"]
    volumes:
      - ./app:/app/app
      - ./vendor/ArchiveBOT:/app/vendor/ArchiveBOT
      - ./vendor/wechat_to_md:/app/vendor/wechat_to_md
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./storage:/storage
    depends_on:
      - redis

volumes:
  redis-data:
