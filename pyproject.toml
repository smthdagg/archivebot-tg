[project]
name = "archivebot-tg"
version = "0.1.0"
description = "Multi-user bilingual Telegram-driven internet document archiving and delivery platform."
requires-python = ">=3.11"
dependencies = [
    # Telegram gateway
    "aiogram>=3.4,<4",
    # Web admin / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Queue
    "redis>=5.0",
    "rq>=1.16",
    # ArchiveBOT runtime deps (vendored submodule requires these)
    "requests>=2.31.0",
    "curl_cffi>=0.7.0",
    "tqdm>=4.66",
    "playwright>=1.44",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdownify>=0.13",
    "markdown>=3.5",
    "trafilatura>=1.6.0",
    "readability-lxml>=0.8.1",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
