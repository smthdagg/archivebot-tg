[project]
name = "archivebot-tg"
version = "1.0.0"
description = "Multi-user bilingual Telegram-driven internet document archiving and delivery platform."
requires-python = ">=3.11"
dependencies = [
    # Telegram gateway
    "aiogram>=3.4,<4",
    # Web admin / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    # Config
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # Queue
    "redis>=5.0",
    "rq>=1.16",
    # ArchiveBOT runtime deps (vendored submodule requires these)
    "requests>=2.31.0",
    "curl_cffi>=0.7.0",
    "tqdm>=4.66",
    "playwright>=1.44",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "markdownify>=0.13",
    "markdown>=3.5",
    "trafilatura>=1.6.0",
    "readability-lxml>=0.8.1",
    "python-dotenv>=1.0.0",
    # 微信公众号解析（vendor/wechat_to_md）
    "httpx>=0.28",
    # ArchiveBOT 微信服务需要 camoufox 反检测浏览器（抓取公众号页面 HTML）
    "camoufox[geoip]>=0.5",
    # 视频平台交付（Phase 2）：ArchiveBOT 的 youtube/bilibili/instagram 等
    # 视频 service 均依赖 yt-dlp 下载/合并（配合系统 ffmpeg）。
    "yt-dlp>=2024.10.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# 显式包发现：仓库含 app/、vendor/、migrations/ 等顶层目录，
# setuptools flat-layout 默认发现会因多顶层包拒绝构建（CI 实测失败）
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "migrations*", "vendor*", "docs*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
